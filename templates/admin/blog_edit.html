{% extends "admin/base_admin.html" %}
{% block content %}
<h1>Редактировать пост</h1>

<form action="/admin/blog/edit/{{ post.id }}" method="post" enctype="multipart/form-data" class="admin-form">
  <label>Заголовок</label>
  <input type="text" name="title" value="{{ post.title }}" required>

  <label>Slug</label>
  <input type="text" name="slug" value="{{ post.slug or '' }}">

  <label>Краткое описание</label>
  <textarea name="excerpt" rows="3">{{ post.excerpt or '' }}</textarea>

  <label>Контент</label>
  <textarea name="content" rows="8">{{ post.content or '' }}</textarea>

  <label>Добавить изображения</label>
  <input type="file" name="images" multiple accept="image/*">

  <button type="submit" class="admin-btn">Сохранить</button>
</form>

<h2>Медиа</h2>
<div class="media-grid">
  {% for m in post.media %}
    <div class="media-item">
      <img src="/static/uploads/blog/{{ m.filename }}" width="140">
      <form action="/admin/blog/{{ post.id }}/media/{{ m.id }}/delete" method="post" onsubmit="return confirm('Удалить изображение?');">
          <button class="delete-btn" type="submit">Удалить</button>
      </form>
    </div>
  {% endfor %}
</div>

<a href="/admin/blog" class="back-btn">← Назад</a>
{% endblock %}
