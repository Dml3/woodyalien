{% extends "admin/base_admin.html" %}
{% block content %}
<h1>Блог</h1>
<a href="/admin/blog/create" class="admin-btn">+ Добавить пост</a>

<table class="admin-table">
  <thead>
    <tr>
      <th>ID</th>
      <th>Заголовок</th>
      <th>Превью</th>
      <th>Дата</th>
      <th>Действия</th>
    </tr>
  </thead>
  <tbody>
    {% for post in posts %}
    <tr>
      <td>{{ post.id }}</td>
      <td>{{ post.title }}</td>
      <td>
        {% for m in post.media[:2] %}
          <img src="/static/uploads/blog/{{ m.filename }}" width="80">
        {% endfor %}
      </td>
      <td>{{ post.date_create.strftime("%Y-%m-%d %H:%M") }}</td>
      <td>
        <a href="/admin/blog/edit/{{ post.id }}" class="edit-btn">Ред.</a>
        <form action="/admin/blog/{{ post.id }}/delete" method="post" style="display:inline" onsubmit="return confirm('Удалить пост?');">
          <button class="delete-btn" type="submit">Удалить</button>
        </form>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
