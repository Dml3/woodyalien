{% extends "admin/base_admin.html" %}
{% block content %}
<h1>Добавить товар</h1>

<form action="/admin/products/create" method="post" enctype="multipart/form-data" class="admin-form">
  <label>Название</label>
  <input type="text" name="title" required>

  <label>Описание</label>
  <textarea name="description" rows="4"></textarea>

  <label>Загрузить изображения</label>
  <input type="file" name="images" multiple accept="image/*">

  <button type="submit" class="admin-btn">Создать</button>
</form>

<a href="/admin/products" class="back-btn">← Назад</a>
{% endblock %}
