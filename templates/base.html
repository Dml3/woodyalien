<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Woody Alien{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.css"/>
</head>
<body>
    <!-- Хедер -->
    <header id="header">
    <div class="header-left">
        <img src="{{ url_for('static', path='images/logo.png') }}" class="logo">
    </div>

    <nav>
    <a href="#home">Главная</a>
    <a href="#about">О нас</a>
    <a href="#blog">Блог</a>
    <a href="#shop">Магазин</a>
</nav>

    <div class="header-right">
        <a href="#" class="social-btn"><img src="/static/icons/vk.svg"></a>
        <a href="#" class="social-btn"><img src="/static/icons/tg.svg"></a>
        <a href="#" class="social-btn"><img src="/static/icons/inst.svg"></a>
    </div>
</header>


    <!-- Контент -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- Футер -->
    <footer>
        <p>© 2025 Woody Alien. Инопланетный декор для земных интерьеров.</p>
        <div class="socials">
            <a href="#">VK</a> | <a href="#">Telegram</a> | <a href="#">Instagram</a>
        </div>
    </footer>

    <!-- Кнопка наверх -->
    <button id="scrollToTopBtn">↑</button>

    <script src="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.js"></script>
    <script src="{{ url_for('static', path='script.js') }}"></script>
</body>
</html>
